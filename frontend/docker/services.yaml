version: "3.8"

services:
  protenix-frontend:
    build:
      context: ../..
      dockerfile: frontend/docker/Dockerfile
    image: protenix-frontend:latest
    container_name: protenix-frontend
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
    ports:
      - "8087:8087"
    volumes:
      # Mount output directory to persist prediction results
      - protenix_output:/root/protenix_output
      # Optional: mount a local directory for input PDB/CIF files
      # - /path/to/your/inputs:/app/inputs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - python3
      - main.py
      - --host=0.0.0.0
      - --port=8087
      - --num_gpus=8
      - --output_dir=/root/protenix_output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  protenix_output:
    driver: local
